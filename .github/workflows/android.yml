name: Android CI

on:
  push:
    branches: [main, initial-scaffold]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional: publish the built APK as a pre-release with this tag (e.g. v0.1.0-debug)"
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test, lint and build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # AGP 8.7.x requires JDK 17 as the minimum and default.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # compileSdk 36 (needed by Media3 1.11) needs platform 36; AGP 8.11 defaults to build-tools 35.0.0.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check toolchain compatibility
        shell: bash
        run: |
          set -euo pipefail

          java_major=$(java -version 2>&1 | head -n1 | sed -E 's/.*version "([0-9]+).*/\1/')
          echo "JDK major version: ${java_major}"
          if [ "${java_major}" -ne 17 ]; then
            echo "::error::AGP 8.11 expects JDK 17, found ${java_major}"
            exit 1
          fi

          gradle_version=$(sed -nE 's/.*gradle-([0-9]+\.[0-9]+(\.[0-9]+)?)-bin\.zip.*/\1/p' gradle/wrapper/gradle-wrapper.properties)
          echo "Gradle wrapper version: ${gradle_version}"
          lowest=$(printf '%s\n%s\n' "8.13" "${gradle_version}" | sort -V | head -n1)
          if [ "${lowest}" != "8.13" ]; then
            echo "::error::AGP 8.11 needs Gradle 8.13 or newer, wrapper uses ${gradle_version}"
            exit 1
          fi

          echo "ANDROID_HOME=${ANDROID_HOME}"
          test -d "${ANDROID_HOME}/platforms/android-36" \
            || { echo "::error::Android platform 36 is missing"; exit 1; }
          test -d "${ANDROID_HOME}/build-tools/35.0.0" \
            || { echo "::error::Build-tools 35.0.0 are missing"; exit 1; }
          echo "Toolchain OK: JDK ${java_major}, Gradle ${gradle_version}, platform 36, build-tools 35.0.0"

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Unit tests, lint and debug APK
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -o pipefail
          # The build label shown in the app: the release tag when there is one, otherwise the short commit.
          LABEL="${INPUT_TAG}"
          if [ -z "${LABEL}" ] && [ "${REF_TYPE}" = "tag" ]; then LABEL="${REF_NAME}"; fi
          if [ -z "${LABEL}" ]; then LABEL="${COMMIT:0:7}"; fi
          ./gradlew --no-daemon --stacktrace --continue -PprismVersion="${LABEL}" -PprismCode="${{ github.run_number }}" testDebugUnitTest lintDebug assembleDebug 2>&1 | tee build.log

      # The job log is not readable from outside GitHub, so compile errors and failed tests are repeated
      # as one annotation that shows up in the run's check summary.
      - name: Report build problems
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          try:
              lines = open("build.log", errors="replace").read().splitlines()
          except OSError:
              lines = []
          found = []
          for i, line in enumerate(lines):
              low = line.lower()
              if line.startswith("e: ") or " error: " in low or "execution failed for task" in low:
                  found.append(line.strip()[:400])
              elif "what went wrong" in low:
                  found += [x.strip()[:400] for x in lines[i + 1:i + 4]]
          for path in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for bad in list(case.findall("failure")) + list(case.findall("error")):
                      found.append("TEST %s.%s: %s" % (case.get("classname"), case.get("name"), (bad.get("message") or "")[:300]))
          unique = []
          for item in found:
              if item not in unique:
                  unique.append(item)
          text = "\n".join(unique[:60]) or "no details found in build.log"
          text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print("::error title=Build problems::" + text)
          PY

      - name: Summarise results
        if: always()
        shell: bash
        run: |
          {
            echo "## Prism Player build"
            echo
            python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          tests = failures = errors = skipped = 0
          for path in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              root = ET.parse(path).getroot()
              tests += int(root.get("tests", 0))
              failures += int(root.get("failures", 0))
              errors += int(root.get("errors", 0))
              skipped += int(root.get("skipped", 0))
          print(f"- Unit tests: {tests} run, {failures} failed, {errors} errors, {skipped} skipped")
          PY
            for apk in app/build/outputs/apk/debug/*.apk; do
              if [ -f "${apk}" ]; then
                echo "- APK: \`$(basename "${apk}")\`, $(du -h "${apk}" | cut -f1)"
                echo "- SHA-256: \`$(sha256sum "${apk}" | cut -d' ' -f1)\`"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prism-player-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prism-player-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

  # Runs only after the build job succeeded, and only when asked for: either a tag like v0.1.0-debug
  # is pushed, or the workflow is started by hand with the release_tag input filled in.
  # The APK is attached to a public pre-release so it has a direct, login-free download link
  # (useful for the Downloader app on Android TV).
  release:
    name: Publish debug APK as pre-release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download APK built by this run
        uses: actions/download-artifact@v4
        with:
          name: prism-player-debug-apk
          path: dist

      - name: Create pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${TAG_INPUT:-${REF_NAME}}"
          if ! [[ "${TAG}" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "::error::Release tag must look like v0.1.0-debug (got: ${TAG})"
            exit 1
          fi
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
             git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::The tag ${TAG} already exists. Run the workflow again with a new release_tag (for example the next version number)."
            exit 1
          fi
          cp dist/app-debug.apk dist/prism-player-debug.apk
          (cd dist && sha256sum prism-player-debug.apk > prism-player-debug.apk.sha256)
          cat > notes.md <<NOTES
          Debug build of Prism Player, built by GitHub Actions from commit ${GITHUB_SHA}.

          - Signed with the Android debug key: for testing only, not for distribution.
          - Install on Android TV with the Downloader app (see README).
          - SHA-256 is in prism-player-debug.apk.sha256.
          NOTES
          echo "::notice::Creating release ${TAG}"
          if ! gh release create "${TAG}" \
            dist/prism-player-debug.apk dist/prism-player-debug.apk.sha256 \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "Prism Player ${TAG}" \
            --notes-file notes.md 2> release-error.txt; then
            echo "::error::gh release create failed for ${TAG}: $(tr '\n' ' ' < release-error.txt)"
            exit 1
          fi
